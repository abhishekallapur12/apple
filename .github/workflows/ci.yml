name: Check simple-review Folder

on:
  pull_request:
    branches:
      - main
      - smart-archive
      - smart-archive2
  push:
    branches:
      - main
      - smart-archive
      - smart-archive2

jobs:
  verify-simple-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Check if simple-review folder exists
        run: |
          if [ -d "simple-review" ]; then
            echo "✅ Folder 'simple-review' exists!"
          else
            echo "❌ Error: Folder 'simple-review' is missing from this branch!"
            exit 1
          fi

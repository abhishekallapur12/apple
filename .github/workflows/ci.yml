name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------
  # 1. CI (Continuous Integration): Test and validate code
  # -----------------------------------------------------------------
  test:
    name: Run Tests (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -v

  # -----------------------------------------------------------------
  # 2. CD (Continuous Delivery): Build, package, verify & release artifact
  # -----------------------------------------------------------------
  deploy:
    name: Build & Package (CD)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distribution package (Wheel & Source Tarball)
        run: python -m build

      - name: Verify built package installation
        run: |
          python -m pip install dist/*.whl
          python -c "import calculator; assert calculator.add(10, 20) == 30; print('CD verification passed: 10 + 20 =', calculator.add(10, 20))"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-calculator-build-${{ github.sha }}
          path: dist/
          retention-days: 7

      - name: Continuous Delivery Summary
        run: |
          echo "=========================================="
          echo "CD Package & Delivery Build Succeeded"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Artifacts generated in dist/:"
          ls -la dist/
          echo "=========================================="
